name: ci

on:
  push:
    branches: ["**"]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - name: sync deps
        run: uv sync --all-groups
      - name: lint（ruff）
        run: uv run ruff check app tests migrations tools
      - name: type（mypy strict）
        run: uv run mypy app
      - name: test（pytest）
        run: uv run pytest -q
      - name: boundary（import-linter：B16 层间单向 + B1 禁框架）
        run: uv run lint-imports
      - name: contract coverage（合同覆盖率闸：AGENTS.md 硬纪律 8——实现有/清单无＝0；清单有/实现无必须带 owner）
        run: uv run python tools/contract_coverage.py check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      - name: lint（eslint：frontend-foundation §2.5，与后端四门禁并列）
        run: npm run lint
      - name: test（vitest：api/client + api/sse）
        run: npm test
      - name: build
        run: npm run build
