name: ci

on:
  push:
    branches: ["**"]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - name: sync deps
        run: uv sync --all-groups
      - name: lint（ruff）
        run: uv run ruff check app appv2 tests migrations tools
      - name: type（mypy strict）
        run: uv run mypy app appv2
      - name: test（pytest）
        run: uv run pytest -q
      - name: boundary（import-linter：B16 层间单向 + B1 禁框架）
        run: uv run lint-imports
      - name: boundary v2（import-linter：V2 契约——ADR-0001/0002 边界闸，root=appv2 双仓禁引/引擎互禁/框架红线）
        run: uv run lint-imports --config tools/importlinter_v2.toml
      - name: contract coverage（合同覆盖率闸：AGENTS.md 硬纪律 8——实现有/清单无＝0；清单有/实现无必须带 owner）
        run: uv run python tools/contract_coverage.py check
      - name: debt markers（债务标记闸：AGENTS.md 硬纪律 8——web 源码债务短语必须携可解析 DEBT 标签）
        run: uv run python tools/debt_markers.py check
      - name: spec gate（规格闸：modules.md 依赖无环/边界规则节/页面映射＋每份 spec 的触及模块与验收测试）
        run: uv run python tools/check_specs.py
      - name: ref resolvable（真源引用可解析闸：规格的真源引用与边界规则编号必须在真源里存在）
        run: uv run python tools/ref_resolvable.py check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: prototype guard（原型树保护闸：DEP-01——原型树同步页 hash × web/prototype-manifest.json，漂移即红）
        working-directory: .
        run: python3 tools/prototype_guard.py check
      - name: install
        run: npm ci
      - name: lint（eslint：frontend-foundation §2.5，与后端四门禁并列）
        run: npm run lint
      - name: test（vitest：api/client + api/sse）
        run: npm test
      - name: build
        run: npm run build
