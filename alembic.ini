# Alembic 迁移配置（P0-08 迁移分组；tickets/phase0/README.md P0-08）。
#
# 目标库 URL 不在此写死：migrations/env.py 从 config/database.yaml 经
# infra.config / infra.db 推导 primary 连接（99 §4.2「config 装载、infra.config
# 供给」；驱动＝postgresql+asyncpg，env.py 以异步引擎跑迁移）。
#
# 分组目录约定：versions/ 单目录平放（不搞多目录）；版本文件 slug 以**域前缀**
# 开头（99 §1 表前缀＝模块归属可读化：infra_/sem_/kb_/chat_/gateway_…），
# 例：20260930_0002_sem_ledger_baseline.py。
#
# 本地实跑（验收命令，P0-08）：
#   uv run alembic upgrade head && uv run alembic downgrade base
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# env.py 程序化推导并覆盖——此处恒空（占位防误用写死 URL）。
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
