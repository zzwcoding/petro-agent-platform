# =====================================================================
# 渤海域 · M2 行为模型（票 09 工序②进仓版）
# ────────────────────────────────────────────────────────────────
# 素材边界：行为证据全部注源 R5。COMMAND 侧 = §2 采集链路（§2.1 手工录入
#   环节保留=脏数据主要来源；15 分钟级 ETL 闭环调度）+ A.2/A.4/A.6 录入/
#   补录台账；QUERY 侧 = §3 指标口径库的查询出口承载（M7 严格一对一，
#   依赖边单向 M7→M2）。行为颗粒度按素材证据最小集划分，未证据的行为不建。
# =====================================================================
model_type: BEHAVIOR
version: "1.0.0"
domain: bohai
behaviors:
  # [R5·§2.1 手工录入环节 + A.2 班次报表] 班次手抄汇总（A/B/C）是脏数据主要来源
  - id: BH-BOHAI-RecordDailyOutput
    name: 录入日产计量
    ownerEntity: AGG-BOHAI-002
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - 井在册且状态非「待弃置」（R5·§4 规则 9 状态机；停产/检修井可否录入待 Owner 确认）
    postconditions:
      - field: dailyProduction.oilOutput
        setValue: newOilOutput
      - field: dailyProduction.reportShift
        setValue: shift
    appliedRules:
      - RULE-BOHAI-005
    requiredPermissions:
      - PERM-BOHAI-RecordDailyOutput
  # [R5·A.6 化验台账 + §4 规则 3 折算密度域]
  - id: BH-BOHAI-RecordFluidTest
    name: 录入流体化验结果
    ownerEntity: AGG-BOHAI-006
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - 取样日期在册（频次不齐不强校验——R5·A.6 高产周报/低产半月报，插补规则待 Owner）
    postconditions:
      - field: fluidTest.waterCutLab
        setValue: newWaterCutLab
      - field: fluidTest.density
        setValue: newDensity
    appliedRules:
      - RULE-BOHAI-001
    requiredPermissions:
      - PERM-BOHAI-RecordFluidTest
  # [R5·A.4 batch_id 补录标记（样本 20260911-T3，T-3 案例）+ §4 规则 9 状态迁移]
  - id: BH-BOHAI-RecordOverhaul
    name: 补录井检修台账
    ownerEntity: AGG-BOHAI-004
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - 批次号带补录标记（R5·A.4 样本 20260911-T3；补录窗口阈值待 Owner 确认）
    postconditions:
      - field: wellOverhaul.overhaulStart
        setValue: newOverhaulStart
      - field: wellOverhaul.overhaulEnd
        setValue: newOverhaulEnd
      - field: wellOverhaul.batchId
        setValue: newBatchId
    appliedRules:
      - RULE-BOHAI-007
    requiredPermissions:
      - PERM-BOHAI-RecordOverhaul
  # [R5·§2.1「ETL 入数据仓库（15 分钟级闭环调度）」+ §4 质量闭环流程「规则命中→问题单生成」]
  - id: BH-BOHAI-RunDailyQualityCheck
    name: 执行日产质检
    ownerEntity: AGG-BOHAI-002
    behaviorType: COMMAND
    triggerType: SYSTEM
    preconditions:
      - 当日批次数据就位（R5·§2.1 15 分钟级闭环调度）
    postconditions:
      - field: qualityCheck.result
        setValue: checkReport
    appliedRules:
      - RULE-BOHAI-002
      - RULE-BOHAI-003
      - RULE-BOHAI-004
      - RULE-BOHAI-008
    requiredPermissions: []
  # [R5·§3 指标抽查面 + §5 Join 白名单 oil ⋈ well ✓] QR-BOHAI-001 的查询行为（M7 一对一）
  - id: BH-BOHAI-QueryWellDailyOutput
    name: 查询单井日产量
    ownerEntity: AGG-BOHAI-001
    behaviorType: QUERY
    triggerType: USER_ACTION
    preconditions: []
    postconditions: []
    # 提取件二落地后装配接线（2026-09-21，PROP-023）：日产突变告警与班次键完整性属日产量口径面，
    # 出厂集同源断言（core 文本命中 ⊆ 卡片装配闭包）实弹照出——新规则须接线进装配面，非fixture误报
    appliedRules:
      - RULE-BOHAI-027
      - RULE-BOHAI-030
    requiredPermissions:
      - PERM-BOHAI-QueryWellDailyOutput
  # [R5·§3 指标 1 产量完成率 + 指标 2 有效产量（两支口径）] 本票影响分析变更的消费枢纽
  - id: BH-BOHAI-QueryBlockMonthlyCompletion
    name: 查询区块月度产量完成率
    ownerEntity: AGG-BOHAI-002
    behaviorType: QUERY
    triggerType: USER_ACTION
    preconditions:
      - 统计月已封账（R5·§3 指标 1 粒度=月/区块；封账规则待 Owner 确认）
    postconditions: []
    appliedRules:
      - RULE-BOHAI-009
      - RULE-BOHAI-019
    requiredPermissions:
      - PERM-BOHAI-QueryBlockMonthlyCompletion
  # [R5·§3 指标 5 综合含水率] 化验/计量打架注记经 RULE-BOHAI-002 容差承载
  - id: BH-BOHAI-QueryBlockWaterCut
    name: 查询区块综合含水率
    ownerEntity: AGG-BOHAI-002
    behaviorType: QUERY
    triggerType: USER_ACTION
    preconditions: []
    postconditions: []
    appliedRules:
      - RULE-BOHAI-010
    requiredPermissions:
      - PERM-BOHAI-QueryBlockWaterCut
  # [R5·§3 指标 11 商品量] 与井口口径天然不等（A.8/事故 7）注记随查询出口描述承载
  - id: BH-BOHAI-QueryMonthlySettlement
    name: 查询区块月度商品量结算
    ownerEntity: AGG-BOHAI-008
    behaviorType: QUERY
    triggerType: USER_ACTION
    preconditions: []
    postconditions: []
    appliedRules: []
    requiredPermissions:
      - PERM-BOHAI-QueryMonthlySettlement
