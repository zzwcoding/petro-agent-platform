# 数据库连接规格——infra.config 装载为 infra.db.DatabaseSpec
# （99 册 §4.2：「DatabaseSpec（config.yaml 装载，infra.config 供给）」）。
# 凭证不进 git：${VAR} / ${VAR:-默认} 经环境变量或 .env 解析（infra.config）。
# 本文件只进结构与开发默认；真实凭证走 .env / 部署环境。
database:
  # 平台主库：开发 PostgreSQL / 生产金仓——双库切换唯一缝＝driver 键（99 §4.1；
  # DRIVER_REGISTRY 注册 postgresql/kingbase，金仓落位批改注册表与 driver 即切）。
  primary:
    driver: postgresql
    name: primary
    host: ${PG_HOST:-localhost}
    port: ${PG_PORT:-5433}      # 宿主 5433：避开 demo-backend 的 petro-demo-pg（占 5432）
    database: ${PG_DB:-petro}
    user: ${PG_USER:-petro}
    password: ${PG_PASSWORD:-petro}
    pool_size: 10
    max_overflow: 5
    pool_recycle_seconds: 1800
    slow_query_ms: 800          # 慢查询阈值 ms（工程日志，非业务审计——99 §4.1）
    readonly: false
  # replica:                    # 只读副本（预留——未配置时读回落 primary，99 §4.1）
  #   driver: postgresql
  #   host: ...
  #   readonly: true
  midplatform:                # 中台源 8 表只读路由（99 §4.1/§2.0②——DP-03 湖真身交付，M-01 启用）
    driver: postgresql
    name: midplatform
    host: ${MIDPLATFORM_PG_HOST:-localhost}
    port: ${MIDPLATFORM_PG_PORT:-5433}   # dev 期与平台库同实例不同 schema（raw/clean/data_plane，DP-03 拍板）；生产独立实例改环境量
    database: ${MIDPLATFORM_PG_DB:-petro}
    user: ${MIDPLATFORM_PG_USER:-midplatform}
    password: ${MIDPLATFORM_PG_PASSWORD:-midplatform}   # dev 默认仅演示态；建账号 SQL＝data-plane 仓 migrations/midplatform_readonly.sql
    pool_size: 5
    max_overflow: 0
    pool_recycle_seconds: 1800
    slow_query_ms: 800          # 慢查询阈值 ms（工程日志，非业务审计——99 §4.1）
    readonly: true              # 强制只读：意图级 flush 守卫＋postgresql_readonly＋账号级 SELECT-only（DP-03 默认拒绝，新源表需显式补授）

# chat 域运行开关（DE-16——与 database 段同文件同装载机制：infra.config
# load_chat_settings 装载，${VAR:-默认} 经环境变量或 .env 解析；段缺省＝全默认）。
chat:
  # N7.4a 新鲜度闸开关：true＝现状（超窗拦停接续/落后改绑照 E2 T-1 语义）；
  # false＝跳过新鲜度闸（不读水位、不拦停不改绑——N7.4b 行级权限、N7.4c 外表
  # 审批零触碰）。非法值拒绝启动（不静默回落）。
  # 云上暂不部署 false（Owner 2026-10-07「云上的先不管」——compose 样例只入仓）。
  freshness_gate_enabled: ${FRESHNESS_GATE_ENABLED:-true}
