# 主平台云上编排（tpa 项目）——后端＋数据面 worker＋MinIO＋Neo4j＋pgvector PG
# 平台自带全栈（独立 tpa 网络，零依赖 fieldforge 编排）；进料面挂 fieldforge
# 产出的 run 目录卷（deploy_ff-data，只读）。
# 用法：cd /opt/petro-agent-platform/deploy && docker compose -p tpa up -d
name: tpa

networks:
  deploy-net:
    external: true
    name: deploy_default

volumes:
  tpa_miniodata:
  tpa_neo4jdata:
  tpa_pgdata:
  deploy_ff-data:
    external: true
    name: deploy_ff-data

services:
  tpa-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tpa_app
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: petro
    volumes:
      - tpa_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpa_app"]
      interval: 5s
      timeout: 3s
      retries: 10

  tpa-neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - tpa_neo4jdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  tpa-minio:
    image: minio/minio          # 云机 /opt/minio-img 源码构建版（x86_64）
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"   # 宿主回环：presigned PUT/运维直连（presign 域名 tpa-minio 仅内网可解）
    volumes:
      - tpa_miniodata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  tpa-backend:
    image: tpa-backend:latest
    build:
      context: /opt/petro-agent-platform
      dockerfile: deploy/cloud/backend.Dockerfile
    env_file: .env
    # DE-10 rerank 档位环境级播种：RERANK_TIER 仅在启动时且 DB 无配置行的场合
    # 以该值建种子行（换新库不再静默回默认 fast）；DB 行恒胜——运行中在 D2 配置
    # 页改档后重启不丢；值非法后端拒绝启动（不静默回落）。合法值 fast/llm/compound。
    environment:
      RERANK_TIER: llm
      # DE-16 新鲜度闸开关（样例只入仓——云上暂不部署，Owner 2026-10-07「云上的先不管」；
      # 下次部署如需关闭 N7.4a 新鲜度闸再取消注释）。取值 true/false，非法值拒绝启动；
      # false＝跳过新鲜度比对（不拦停不改绑——N7.4b 行级权限、N7.4c 外表审批零触碰）。
      # FRESHNESS_GATE_ENABLED: "false"
    restart: unless-stopped
    # 双网络：平台内网（postgres/neo4j/minio）＋ fieldforge 网（nginx 反代可达）
    networks:
      - default
      - deploy-net
    depends_on:
      tpa-postgres:
        condition: service_healthy
      tpa-neo4j:
        condition: service_healthy
      tpa-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # V2 问一问后端（:8001——q12_v2_launcher；与 tpa-backend 共用镜像）。
  # 公网入口 nginx /api/v2/ → tpa-v2-backend:8001（ECS nginx 实配）。
  # 本服务块 2026-10-14 从 ECS 实况回仓（此前只在云上 compose 里——源码重建
  # 会丢；20261013 交接「compose 形按 ECS 实况」的缺口随本块收口）。
  tpa-v2-backend:
    image: tpa-backend:latest
    env_file: .env
    environment:
      EVAL_FROZEN_DATE: "real"
      # DE-16 新鲜度闸临时关闭（Owner 2026-10-14 拍板——水位止 8-31 与真实时钟
      # 差距拦停体验面；恢复＝改回 "true" 并 up -d 重建。非法值拒绝启动）。
      FRESHNESS_GATE_ENABLED: "false"
    command: ["python", "-m", "uvicorn", "q12_v2_launcher:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped
    networks:
      - default
      - deploy-net
    depends_on:
      tpa-postgres:
        condition: service_healthy
      tpa-neo4j:
        condition: service_healthy
      tpa-minio:
        condition: service_healthy
    healthcheck:
      # 8001 不发布宿主端口（nginx 走内网名）——容器内 TCP 探活。
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('localhost',8001),3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  tpa-worker:
    image: tpa-worker:latest
    build:
      context: /opt/petro-agent-platform/data-plane
      dockerfile: deploy/cloud-worker.Dockerfile
    env_file: .env
    environment:
      DP_PIPELINE_RUN_DIR: ${DP_PIPELINE_RUN_DIR:-/data/runs}
      # DE-10：与 backend 同值注入（播种语义同上——env 仅播种，DB 行恒胜）；
      # worker 侧消费随数据面票，本行只保证两进程环境一致。
      RERANK_TIER: llm
      # DE-16：与 backend 同款注释样例（云上暂不部署——语义见 backend 段注释；
      # worker 是否消费该变量属数据面仓裁决，本行只保证两进程环境一致）。
      # FRESHNESS_GATE_ENABLED: "false"
    volumes:
      - deploy_ff-data:/data:ro
    restart: unless-stopped
    depends_on:
      tpa-postgres:
        condition: service_healthy
      tpa-minio:
        condition: service_healthy
