# 主平台接管 :80 后的 nginx 总路由（v2——替换 fieldforge deploy/nginx/default.conf）
# /            → 平台前端静态（web/dist）
# /api/        → tpa-backend:8000（SSE 流式友好——chat/asks 流不缓冲）
# /fieldforge/ → fieldforge-api:8000（子路径；8080 整端口直达同保留）
# /dp/ 已移除——旧数据面问答面 DP-02 退役（Owner 2026-10-06 拍板删除线上实体）
server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # 平台前端（vite 构建产物；SPA 路由回落 index.html）
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 平台后端 API——路径原样透传（后端路由自带 /api 前缀）
    location /api/ {
        proxy_pass http://tpa-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # SSE 流式（chat/asks 帧流）不缓冲、长读超时
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # fieldforge 数据生产 API（子路径，前缀剥除）
    location /fieldforge/ {
        proxy_pass http://fieldforge-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# fieldforge 整端口直达（既有调用方零改动——仅换端口）
server {
    listen 8080;
    server_name _;
    location / {
        proxy_pass http://fieldforge-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
