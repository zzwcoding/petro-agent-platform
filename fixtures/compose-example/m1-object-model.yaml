# =====================================================================
# 组合示例域 · M1 对象模型（票 33 fixtures 素材——组合产物仍是草案）
# ────────────────────────────────────────────────────────────────
# 组合自 ontology/patterns/ 两件模式件：
#   patterns/state-machine-lifecycle → 聚合根 lifecycle + 当前状态
#     DictionaryRef 属性 + 设备状态字典（EQUIP_STATUS，四态含一停用项）；
#   patterns/coded-dictionary → 设备类别 DictionaryRef 属性 + 设备类别
#     字典（EQUIP_CATEGORY）。
# 组合纪律实证：占位符全部替换；元素 description 注记
#   「组合自 patterns/<pattern_id>」（两件并列）；产物仍是草案走人审。
# 域词（设备）只存在于 fixtures 素材；证据非权威，待 Owner 确认。
# =====================================================================
model_type: OBJECT
version: "1.0.0"
domain: equip-demo
aggregates:
  - id: AGG-EQUIP-001
    name: 设备
    alias: Equipment
    description: "通用设备台账（组合示例域，fixtures 素材；组合自 patterns/state-machine-lifecycle；组合自 patterns/coded-dictionary；证据非权威，待 Owner 确认）。"
    aggregateType: AGGREGATE_ROOT
    lifecycle: [在用, 维修中, 停用, 报废]   # 与 EQUIP_STATUS 字典 items 的 label 逐一对齐（state-machine-lifecycle 组合纪律）
    attributes:
      - name: equipCode
        label: 设备编号
        type: String
        required: true
        unique: true
      - name: equipName
        label: 设备名称
        type: String
      - name: status
        label: 当前状态
        type: DictionaryRef
        required: true
        dictionaryRef:
          dictionaryId: DICT-EQUIP-01
          typeCode: EQUIP_STATUS
      - name: category
        label: 设备类别
        type: DictionaryRef
        required: true
        dictionaryRef:
          dictionaryId: DICT-EQUIP-02
          typeCode: EQUIP_CATEGORY
data_dictionaries:
  # 组合自 patterns/state-machine-lifecycle：状态值集唯一真源=字典 items
  - id: DICT-EQUIP-01
    name: 设备状态字典
    types:
      - typeCode: EQUIP_STATUS
        typeName: 设备状态
        items:
          - code: IN_USE
            label: 在用
            enabled: true
            sortOrder: 1
          - code: IN_REPAIR
            label: 维修中
            enabled: true
            sortOrder: 2
          - code: DISABLED   # 停用项保留行演示（validity-versioning 纪律：停用置 false 不删除）
            label: 停用
            enabled: false
            sortOrder: 3
          - code: SCRAPPED
            label: 报废
            enabled: true
            sortOrder: 4
  # 组合自 patterns/coded-dictionary：码=稳定存储值（不改），label=展示名（可改）
  - id: DICT-EQUIP-02
    name: 设备类别字典
    types:
      - typeCode: EQUIP_CATEGORY
        typeName: 设备类别
        items:
          - code: POWER
            label: 动力设备
            enabled: true
            sortOrder: 1
          - code: DRIVE
            label: 传动设备
            enabled: true
            sortOrder: 2
          - code: AUX
            label: 辅助设备
            enabled: true
            sortOrder: 3
