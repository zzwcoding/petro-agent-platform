# =====================================================================
# 负变体 · fragment 不是合法 YAML（票 33 AC3：结构探针 exit 1 指认）
# ────────────────────────────────────────────────────────────────
# 头字段齐全，但 fragment 区域有 YAML 语法错误——占位符未加引号，
# 裸 {{域前缀}} 落 YAML 流解析直接炸（票 33 设计裁决：占位符必须
# 双引号包裹）。结构探针必须报「YAML 不可解析（含 fragment 区域）」
# 并以非零退出。
# =====================================================================
pattern_id: broken-fragment-demo
name: 坏 fragment 示例（票 33 负变体）
description: fragment 区域占位符未加引号，裸 {{ 双花括号落 YAML 流解析。
applies_when: 演示用（负变体，非真模式件）
fragment:
  aggregates:
    - id: {{域前缀}}
compose_notes: 演示用负变体
source: 票 33 负变体
