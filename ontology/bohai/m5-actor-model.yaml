# =====================================================================
# 渤海域 · M5 主体模型（票 09 工序②进仓版）
# ────────────────────────────────────────────────────────────────
# 素材边界：角色证据 = R5·§1 组织与责任链八张角色卡（逐行注源）；参与者
#   按岗位/系统承载（§1 人名为角色卡示例，不建个人 actor）；SYSTEM 参与者
#   源自 §2.1「ETL 入数据仓库（15 分钟级闭环调度）」。
# 权限面纪律：Owner/治理类角色的裁决权走 MR/治理面（R5·§1 高影响变更审批、
#   Review Board），不在行为权限面——permissions 留空并注明，待 Owner 确认
#   是否二期补审批行为。小李兼岗 = 一 actor 承两 role（§1 原文「小李兼」）。
# =====================================================================
model_type: ACTOR
version: "1.0.0"
domain: bohai
actors:
  # [R5·§1 角色卡「采集管理员：作业区资料员」——源头数据采集与清单维护]
  - actorId: ACTOR-BOHAI-001
    name: 作业区资料员（采集管理员）
    actorType: HUMAN
    roles:
      - ROLE-BOHAI-001
    attributes:
      dutyStation: 作业区
  # [R5·§1 角色卡「质量管理员：地质研究所（小李兼）」+「技术支持：地质研究所」——兼岗一 actor 两 role]
  - actorId: ACTOR-BOHAI-002
    name: 地质研究所（质量/技术支持岗）
    actorType: HUMAN
    roles:
      - ROLE-BOHAI-002
      - ROLE-BOHAI-008
    attributes:
      dutyStation: 地质研究所
  # [R5·§2.1「ETL 入数据仓库（15 分钟级闭环调度）」——质检行为的 SYSTEM 触发方]
  - actorId: ACTOR-BOHAI-003
    name: 生产库 ETL 调度
    actorType: SYSTEM
    roles: []
    attributes:
      cadence: 15 分钟级闭环调度
roles:
  # [R5·§1 角色卡「采集管理员：作业区资料员」——源头治理原则的岗位化]
  - roleId: ROLE-BOHAI-001
    name: 采集管理员
    inheritsFrom: []
    permissions:
      - PERM-BOHAI-RecordDailyOutput
      - PERM-BOHAI-RecordFluidTest
      - PERM-BOHAI-RecordOverhaul
  # [R5·§1 角色卡「质量管理员：地质研究所」——质检任务配置、复检、质量报告]
  - roleId: ROLE-BOHAI-002
    name: 质量管理员
    inheritsFrom: []
    permissions:
      - PERM-BOHAI-RunDailyQualityCheck
      - PERM-BOHAI-QueryBlockWaterCut
  # [R5·§1 角色卡「业务 Owner（产量口径）：开发室」——§3 产量/递减/含水类指标裁决]
  - roleId: ROLE-BOHAI-003
    name: 业务 Owner 产量口径（开发室）
    inheritsFrom: []
    permissions:
      - PERM-BOHAI-QueryWellDailyOutput
      - PERM-BOHAI-QueryBlockMonthlyCompletion
  # [R5·§1 角色卡「业务 Owner（措施口径）：采油工艺所」——措施/注水/能效类指标]
  - roleId: ROLE-BOHAI-004
    name: 业务 Owner 措施口径（采油工艺所）
    inheritsFrom: []
    permissions: []   # 措施/注采比查询出口二期补后挂接（待 Owner 确认）
  # [R5·§1 角色卡「业务 Owner（经营口径）：销售计量站」——商品量/结算（与井口口径冲突源）]
  - roleId: ROLE-BOHAI-005
    name: 业务 Owner 经营口径（销售计量站）
    inheritsFrom: []
    permissions:
      - PERM-BOHAI-QueryMonthlySettlement
  # [R5·§1 角色卡「语义 Owner（平台）：阿强 + 数据管理岗」——目录维护、MR 评审组织、CI 执行]
  - roleId: ROLE-BOHAI-006
    name: 语义 Owner（数据管理岗）
    inheritsFrom: []
    permissions: []   # 裁决权走 MR/治理面，不在行为权限面（待 Owner 确认是否补审批行为）
  # [R5·§1 角色卡「数据治理领导组」——高影响变更审批、Review Board]
  - roleId: ROLE-BOHAI-007
    name: 数据治理领导组
    inheritsFrom: []
    permissions: []   # 高影响变更审批走治理面/MR（R5·§1），不建审批行为（一期）
  # [R5·§1 角色卡「技术支持：地质研究所」——标准编制、体检规则、术语审定]
  - roleId: ROLE-BOHAI-008
    name: 技术支持（地质研究所）
    inheritsFrom: []
    permissions: []
permissions:
  # [R5·§2.1 手工录入 + A.2 班次报表] 采集管理员录入日产计量
  - permissionId: PERM-BOHAI-RecordDailyOutput
    targetType: BEHAVIOR
    targetRef: BH-BOHAI-RecordDailyOutput
    dataScope: DEPT        # 作业区为本部门数据（R5·§1 采集管理员按作业区设岗）
  # [R5·A.6 化验台账] 采集/化验录入
  - permissionId: PERM-BOHAI-RecordFluidTest
    targetType: BEHAVIOR
    targetRef: BH-BOHAI-RecordFluidTest
    dataScope: DEPT
  # [R5·A.4 检修台账补录（T-3 案例）]
  - permissionId: PERM-BOHAI-RecordOverhaul
    targetType: BEHAVIOR
    targetRef: BH-BOHAI-RecordOverhaul
    dataScope: DEPT
  # [R5·§4 质量闭环「质检任务配置、复检」] 质检行为（SYSTEM 触发，权限面登记岗位职责）
  - permissionId: PERM-BOHAI-RunDailyQualityCheck
    targetType: BEHAVIOR
    targetRef: BH-BOHAI-RunDailyQualityCheck
    dataScope: ALL
  # [R5·§3 指标抽查面] 单井日产量查询
  - permissionId: PERM-BOHAI-QueryWellDailyOutput
    targetType: BEHAVIOR
    targetRef: BH-BOHAI-QueryWellDailyOutput
    dataScope: ALL
  # [R5·§3 指标 1/2] 区块月度产量完成率查询（本票影响分析变更的消费出口）
  - permissionId: PERM-BOHAI-QueryBlockMonthlyCompletion
    targetType: BEHAVIOR
    targetRef: BH-BOHAI-QueryBlockMonthlyCompletion
    dataScope: ALL
  # [R5·§3 指标 5] 区块综合含水率查询
  - permissionId: PERM-BOHAI-QueryBlockWaterCut
    targetType: BEHAVIOR
    targetRef: BH-BOHAI-QueryBlockWaterCut
    dataScope: ALL
  # [R5·§3 指标 11] 商品量结算查询（经营口径）
  - permissionId: PERM-BOHAI-QueryMonthlySettlement
    targetType: BEHAVIOR
    targetRef: BH-BOHAI-QueryMonthlySettlement
    dataScope: ALL
