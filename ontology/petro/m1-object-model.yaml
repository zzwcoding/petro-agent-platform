# =====================================================================
# Petro-Agent 平台七域 · M1 对象模型（轨道 0 fork 批：bohai 对齐底稿 → petro 平台域）
# ────────────────────────────────────────────────────────────────
# fork 纪律（alignment/bohai-to-platform.md 三清单 + Owner 2026-09-29 裁决）：
#   · 复用 17 元素（10 聚合+7 关联）自 bohai/ 迁入，元素 id 前缀按域标识
#     BOHAI→PETRO（前缀即类型纪律）；注源逐元素保留（R5/§ 引用不改——真源仍是
#     主仓 teach-petro-agent 设定书 v3）；
#   · 裁决记录引用 PROP-BOHAI-* 保留原样（历史裁决不重写，不随前缀改）；
#   · 增补实建 6 元素（Owner 裁决 b 案 1 显式空壳雏形位，建行驱动=平台对象账行
#     需要）：AGG-PETRO-011 井筒（§5 属性素材=段/射孔/防砂）/ 012 油田 / 013 平台 /
#     014 配注层（attributes 空壳）+ ASSOC-PETRO-008 区块—隶属→油田 /
#     009 平台—承载→井（关系账两段）——只登设定书原文属性，无杜撰。
# 素材边界（沿 bohai 底稿）：全部元素注源 R5。聚合根源自 db-reverse 草案（证据
#   非权威）+ Owner 裁决（bohai 工序②，裁决记录 PROP-BOHAI-*）。DDL 无外键，
#   引用结构（wellRef/ASSOC/AGG-PETRO-009）全部来自 R5·§5 业务草案并逐处注源；
#   设定书没有的一律不建。
# 表示法注记：子表同时保留 wellId（DDL 键列，复合主键成分）与 wellRef（§5 语义
#   引用）——双表示属转写残留，是否以 wellRef 吸收 wellId 待 Owner 确认（清理属
#   ID/键变更，须过影响分析）；平台侧引用结构以 wellRef 承载（对齐矩阵不迁清单
#   #1：冗余键清理待影响分析，本体保真迁移）。
# =====================================================================
model_type: OBJECT
version: "1.0.0"
domain: petro
aggregates:
  # [R5·A.1 井档案 + §5 实体「井」] Owner 裁决：对象名从 §5 实体草案取短名「井」
  - id: AGG-PETRO-001
    name: 井
    alias: Well
    description: "源表 well_info（R5·设定书附录 A.1，字典标题「井档案」；§5 实体草案名「井」），一井一行。§1 组织规模：3 作业区 120 口在产井（采油 86/注水 34）、5 平台。疑点残留：井号旧写法 N2/N-2 并存（D6，归一化落 RULE-PETRO-005，全集待素材）；fieldName 行内冗余（D8）——待 Owner 确认。状态滞后（D7）已裁：责任方=作业区录入+治理稽核检出（PROP-BOHAI-012，2026-09-21）。"
    aggregateType: AGGREGATE_ROOT
    lifecycle: [生产中, 停产, 检修, 待弃置]   # [R5·A.1 current_status 值集 + §5 井「状态机」] 迁移合法性校验 RULE-PETRO-007
    attributes:
      - { name: wellId, label: 井号, type: String, unique: true }   # [R5·A.1 PK well_id] D6：旧写法 N2/N-2 并存，归一化 RULE-PETRO-005
      - { name: wellName, label: 井名, type: String }               # [R5·A.1] 样本 渤中28-1-N2
      - { name: wellType, label: 井别, type: Enum, enumValues: [EW, IW] }   # [R5·A.1] EW 采油·IW 注水；个别改型未留版本待 Owner
      - { name: firstProdDate, label: 首次投产日期, type: Date }    # [R5·A.1] 自然递减率「扣新井」判据用（§3 指标 3）
      - { name: platform, label: 平台, type: String }               # [R5·A.1] 样本 CEP-A/B；§5「平台—承载→井」未建对象（无源表，待 Owner）——fork 批已建雏形位 AGG-PETRO-013（Owner 2026-09-29 裁决 b），本行内承载保留、引用化改造悬置
      - { name: blockName, label: 区块, type: String }              # [R5·A.1] 渤南/渤中/渤西；§5「井—隶属→区块」未建对象（无源表，待 Owner）——fork 批关系账两段 ASSOC-PETRO-008/009 已建（裁决 b 联动），blockName→blockRef 改造仍悬置（M1 头注）
      - { name: fieldName, label: 油田, type: String }              # [R5·A.1] 行内冗余=反规范化样例（D8 待 Owner）——fork 批油田建雏形位 AGG-PETRO-012（裁决 b 重裁），行内冗余保留
      - { name: currentStatus, label: 当前状态, type: Enum, enumValues: [生产中, 停产, 检修, 待弃置] }   # [R5·A.1] 状态时效裁决（PROP-BOHAI-012，2026-09-21）：更新责任方=作业区录入（源侧生产责任），治理面稽核滞后检出出清单；不增设状态时间戳属性（字典无此列，不发明）；SLA 时限值待治理面定（入问题清单）；「检修」值是 RULE-PETRO-019 剔检口径的判定字段
      - { name: remarks, label: 备注, type: String }                # [R5·A.1] 供应商导入曾塞入注入指令
  # [R5·A.2 日产计量（★核心事实源）+ §5 Join 白名单 oil ⋈ well ✓]
  - id: AGG-PETRO-002
    name: 日产计量
    alias: OilProductionDaily
    description: "源表 oil_production_daily（R5·设定书附录 A.2，字典标注核心事实源），**行粒度=班次**（Owner 2026-09-21，PROP-BOHAI-007 裁决=A：A/B 班各行各含当班真实产量，非重复录入），复合主键（wellId, prodDate, reportShift）；**日口径=同井同日各班合计**（SUM 天然兼容，下游按日聚合规则不受影响）。§3 指标 1/3/4/5/7/10/14 的承载事实源。疑点残留：吨方混写（D1→RULE-PETRO-020 检出位已建）；配产双值行（D4）；openDays 停井日>0（D5，值域已下沉 refRules）——均待 Owner 确认。"
    aggregateType: AGGREGATE_ROOT
    attributes:
      - name: wellRef            # [R5·§5「oil_production_daily ⋈ well_info（井号）✓」+ A.2 键列] 引用 vs 依赖待 Owner
        label: 所属井
        type: AggregateRootRef
        targetAggregate: AGG-PETRO-001
      - { name: wellId, label: 井号, type: String }                  # [R5·A.2 复合主键成分] D6 归一化 RULE-PETRO-005
      - { name: prodDate, label: 生产日期, type: Date }              # [R5·A.2 复合主键成分]
      - { name: oilOutput, label: 日产油量（吨）, type: Decimal }    # [R5·A.2] D1 吨方混写；§3 指标 1/2/3/4/10/14 的分子/基线承载
      - { name: liquidOutput, label: 日产液量（方）, type: Decimal } # [R5·A.2] §3 指标 5/6/7/12 承载
      - name: waterCut          # [R5·A.2 化验折算] §4 规则 5 值域下沉。权威源裁决（Owner 2026-09-21，PROP-BOHAI-008 采纳=C 并存分场景）：本属性（计量折算）为日度监控口径；月度/正式指标取数以 AGG-PETRO-006.waterCutLab 化验实测为准（RULE-PETRO-010 取数方向随 PROP-BOHAI-031 落定）；与化验偏差 >5pp（RULE-PETRO-002 容差）时以化验校正
        label: 含水率（%）
        type: Decimal
        refRules:
          - name: 含水率值域
            expression: value >= 0 and value <= 100
            violationMessage: 含水率须在 [0,100]（R5·§4 规则 5）
            enforcedAt: ALWAYS
      - { name: planOutput, label: 配产量（吨）, type: Decimal }     # [R5·A.2] D4 双值行待 Owner；§3 指标 1 分母承载
      - name: openDays          # [R5·A.2] D5 矛盾行；§4 规则 5 值域下沉；§3 指标 14 时率承载
        label: 开井时长（天）
        type: Decimal
        refRules:
          - name: 开井时长值域
            expression: value >= 0 and value <= 24
            violationMessage: 开井时长须在 [0,24]（R5·§4 规则 5）
            enforcedAt: ALWAYS
      - { name: oilPressure, label: 油压（MPa）, type: Decimal }     # [R5·A.2]
      - { name: reportShift, label: 报表班次, type: Enum, enumValues: [A, B, C] }   # [R5·A.2] 主键成分（PROP-BOHAI-007=A，2026-09-21：行粒度=班次，日口径=各班合计）；§2.1 手工录入环节是脏数据主要来源
  # [R5·A.3 + §5] 注水侧事实源；§3 指标 6/7/12 承载
  - id: AGG-PETRO-003
    name: 注水日计量
    alias: WaterInjectionDaily
    description: "源表 water_injection_daily（R5·设定书附录 A.3），键=井号+日期，复合主键（wellId, injDate）；injDate 为列名转写补记。layerSplit 格式规范已到（Owner 素材 owner-materials-2026-09-21 §PROP-014，2026-09-21）：`层段号:配注量;…`（分号分隔、冒号键值、两侧无空格，配注量 m³/d，如 F1:40;F2:35）；两层/三层按键数区分（≥4 或 =1 为异常形态进问题单）；「偶为累计值」甄别=各层和≈当日日注量（相对偏差 ≤2%）且前后行为日注量形态→判累计值误填，进问题单不参与分层聚合。承载取舍：schema 无数组类型，不新增结构化属性——规范格式本身机读可判，消费方按规范现场解析；配注合格率指标化另走 add 提案。§5：oil_production_daily ⋈ 本对象直连禁止（须经 AGG-PETRO-009 受效关系）。"
    aggregateType: AGGREGATE_ROOT
    attributes:
      - name: wellRef            # [R5·§5 注水井实体 + A.3 键列]
        label: 所属井
        type: AggregateRootRef
        targetAggregate: AGG-PETRO-001
      - { name: wellId, label: 井号, type: String }                  # [R5·A.3 复合主键成分]
      - { name: injDate, label: 注水日期, type: Date }               # [R5·A.3 列名补记]
      - { name: injVolume, label: 注水量（方）, type: Decimal }      # [R5·A.3] §3 指标 6/7/12 承载
      - { name: pumpPressure, label: 泵压（MPa）, type: Decimal }    # [R5·A.3]
      - { name: layerSplit, label: 分层配注, type: String }          # [R5·A.3] 格式规范已到（PROP-BOHAI-014 关箱 2026-09-21）：层段号:配注量 分号分隔；键数区分两/三层；累计值甄别≤2%（规范全文见本对象 description）
  # [R5·A.4] 检修台账；§3 指标 2（剔检）/13 承载；票 09 影响分析变更的台账面
  - id: AGG-PETRO-004
    name: 井检修记录
    alias: WellOverhaul
    description: "源表 well_overhaul（R5·设定书附录 A.4），键=井号+起止，复合主键（wellId, overhaulStart, overhaulEnd）。疑点残留：跨月作业口径切割（D10，波及 RULE-PETRO-016/019）；affectedOutput 估算口径不一；batchId 补录（D11，BH-PETRO-RecordOverhaul 前置条件承载）。术语注记（R5·§6）：作业区口语「躺井」指停产待检泵——限作业区语境（Owner=采油工艺所）。"
    aggregateType: AGGREGATE_ROOT
    attributes:
      - name: wellRef            # [R5·§5 + A.4 键列]
        label: 所属井
        type: AggregateRootRef
        targetAggregate: AGG-PETRO-001
      - { name: wellId, label: 井号, type: String }                  # [R5·A.4 复合主键成分]
      - { name: overhaulStart, label: 检修开始日期, type: Date }     # [R5·A.4 复合主键成分；样本 2026-08-28]
      - { name: overhaulEnd, label: 检修结束日期, type: Date }       # [R5·A.4 样本 2026-09-06；D10 跨月]
      - { name: overhaulType, label: 检修类型, type: String }        # [R5·A.4] 样本仅「检泵」值集不全不建枚举；§3 指标 13 判据用
      - { name: affectedOutput, label: 影响产量（吨）, type: Decimal }   # [R5·A.4] 各作业区估算口径不一待 Owner
      - { name: batchId, label: 批次号, type: String }               # [R5·A.4] D11 补录标记（样本 20260911-T3）
  # [R5·A.5] 措施台账；§3 指标 8/9/10/15 承载
  - id: AGG-PETRO-005
    name: 井措施记录
    alias: WellMeasures
    description: "源表 well_measures（R5·设定书附录 A.5），键=井号+措施次，复合主键（wellId, measureSeq）；measureSeq 为列名转写补记。疑点残留：有效期 30% 缺失（D12）；incrOilAnnual 两作业区算法不一致=事故 7（D13）。§7 剧本 2《注水井措施评估》的台账面。"
    aggregateType: AGGREGATE_ROOT
    attributes:
      - name: wellRef            # [R5·§5「措施—作用于→井」+ A.5 键列]
        label: 所属井
        type: AggregateRootRef
        targetAggregate: AGG-PETRO-001
      - { name: wellId, label: 井号, type: String }                  # [R5·A.5 复合主键成分]
      - { name: measureSeq, label: 措施次序, type: Integer }         # [R5·A.5 复合主键成分；列名补记]
      - { name: measureType, label: 措施类型, type: Enum, enumValues: [压裂, 酸化, 补孔, 调剖] }   # [R5·A.5 字典值集]
      - { name: jobDate, label: 施工日期, type: Date }               # [R5·A.5]
      - { name: effectiveFrom, label: 有效期起, type: Date }         # [R5·A.5] D12 约 30% 缺失，不设 required
      - { name: effectiveTo, label: 有效期止, type: Date }           # [R5·A.5] D12
      - { name: incrOilAnnual, label: 年增油量（吨）, type: Decimal }   # [R5·A.5] D13 事故 7
  # [R5·A.6] 化验台账；§3 指标 5 数据源 2.6；§4 规则 3/4 承载
  - id: AGG-PETRO-006
    name: 流体化验记录
    alias: FluidTest
    description: "源表 fluid_test（R5·设定书附录 A.6），键=井号+取样日期，复合主键（wellId, sampleDate）；sampleDate 为列名转写补记。权威源裁决已落定（Owner 2026-09-21，PROP-BOHAI-008=C）：本表化验实测为月度/正式指标权威源，日度监控用计量折算，>5pp 以化验校正（容差检测 RULE-PETRO-002）。取样频次与插补已由 RULE-PETRO-029 承载（提取件二 R-16，2026-09-21）。§5 Join 白名单：oil_production_daily ⋈ 本对象直连禁止（须井号+取样日期双键+时间容差经中间视图）。"
    aggregateType: AGGREGATE_ROOT
    attributes:
      - name: wellRef            # [R5·§5「化验样—取样自→井」+ A.6 键列]
        label: 所属井
        type: AggregateRootRef
        targetAggregate: AGG-PETRO-001
      - { name: wellId, label: 井号, type: String }                  # [R5·A.6 复合主键成分]
      - { name: sampleDate, label: 取样日期, type: Date }            # [R5·A.6 列名补记]
      - { name: waterCutLab, label: 化验含水率（%）, type: Decimal } # [R5·A.6] 权威源裁决（PROP-BOHAI-008=C，2026-09-21）：月度/正式指标权威源；取样频次/插补争议仍待 Owner
      - { name: density, label: 密度（t/m³）, type: Decimal }        # [R5·A.6] §4 规则 3 折算密度域 [0.82,0.98]
      - { name: apiGravity, label: API 度, type: Decimal }           # [R5·A.6]
  # [R5·A.7] 设备台账；§4 规则 8/11 关联面
  - id: AGG-PETRO-007
    name: 设备状态记录
    alias: EquipStatus
    description: "源表 equip_status（R5·设定书附录 A.7），键=设备号+时间戳，复合主键（equipId, statusTime）；equipId/statusTime 为列名转写补记。疑点残留：stopReasonCode 新旧编码并存（D14，RULE-PETRO-006 映射全集已到）。load/current 单位已声明（kN/A，Owner 素材 2026-09-21 §PROP-025）。§5 未声明设备—井关系，故不建 wellRef（零证据零引用，待 Owner）。"
    aggregateType: AGGREGATE_ROOT
    attributes:
      - { name: equipId, label: 设备号, type: String }               # [R5·A.7 复合主键成分；列名补记]
      - { name: statusTime, label: 状态时间戳, type: DateTime }      # [R5·A.7 复合主键成分；列名补记]
      - { name: equipType, label: 设备类型, type: Enum, enumValues: [电泵, 螺杆泵, 加热炉] }   # [R5·A.7 字典值集]
      - { name: load, label: 负载, type: Decimal }                   # [R5·A.7] 单位=kN（Owner 素材 2026-09-21 §PROP-025）；设备级光杆功率核算用
      - { name: current, label: 电流, type: Decimal }                # [R5·A.7] 单位=A（Owner 素材 2026-09-21 §PROP-025）；RULE-038 零值告警（批面近似）不依赖单位
      - { name: stopReasonCode, label: 停机原因码, type: String }    # [R5·A.7] D14 新旧编码并存，不建枚举
  # [R5·A.8] 经营侧事实源；§3 指标 11 商品量承载
  - id: AGG-PETRO-008
    name: 区块月度结算
    alias: MonthlySettlement
    description: "源表 monthly_settlement（R5·设定书附录 A.8），键=区块+结算月，复合主键（blockName, settleDate），settleDate 粒度为月（v2 兼容声明：规范名）。口径仲裁已落定（Owner 2026-09-21，PROP-BOHAI-020=①+②+③）：商品量（netWeight，扣自用油与输差）与井口口径（AGG-PETRO-002.oilOutput 区块合计）**并存披露不互替**；使用边界：生产类指标用井口口径、经营/结算类指标用商品量；折算关系成文：商品量 = 井口合计 ×（1−自用率−输差率）——输差率口径框架本裁确立，具体阈值待 Owner 后续提案（事故 7/13 同源问题的标准答案：两口径之差=自用+输差）。"
    aggregateType: AGGREGATE_ROOT
    attributes:
      - { name: blockName, label: 区块, type: String }               # [R5·A.8 复合主键成分；渤南/渤中/渤西]
      - { name: settleDate, label: 结算月, type: Date }              # [R5·A.8 复合主键成分；粒度=月]
      - { name: netWeight, label: 商品量净重（吨）, type: Decimal }  # [R5·A.8] §3 指标 11「商品量」承载（扣自用油与输差）；口径仲裁见本对象 description（PROP-BOHAI-020）
  # [R5·§5 业务实体，无源表] 注水井→受效油井 多对多关系实体；物理落表待 Owner 确认
  - id: AGG-PETRO-009
    name: 受效关系
    alias: EffectuationRelation
