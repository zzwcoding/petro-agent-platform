# =====================================================================
# Petro-Agent 平台七域 · M2 行为模型（轨道 0 fork 批：bohai 对齐底稿 → petro 平台域）
# ────────────────────────────────────────────────────────────────
# fork 纪律：复用 8 条（4 COMMAND+4 QUERY）自 bohai/ 迁入，前缀 BOHAI→PETRO；
#   注源保留（R5/§），PROP-BOHAI-* 历史裁决引用原样。
# 执行面注记（对齐矩阵 §2.7 反向行/不迁清单 #2）：三条源侧录入 COMMAND 本体迁入
#   （M3 reusedBy/M5 PERM 引用闭合不可断、E2 责任岗与脏数据来源语义消费），但
#   「平台执行该写入」不成立——源侧执行归源系统/中台 ETL（PROP-BOHAI-011(b) 同款
#   位置逻辑）；RunDailyQualityCheck 平台消费面=E2 端点 3 质检任务（四步流水）。
# 平台 Action 合同登记（非 M2 元素——对齐矩阵 §3b #18–20 + 裁决 f 尾注：受控写入
#   与源侧动作两族并立不互迁；八模型无 Action 登记位、schema 本批仅授权 M3 口径
#   字段，故以本注记承载合同面，登记驱动=平台 Action 账三行，同步器 sem_action 照
#   C1 ACTIONS 合同投影）：
#   1. update_well_remark 更新井备注（C1 ACTIONS #1；源 lessons/61·票 92 引用主位，
#      无 § 直锚——井备注=AGG-PETRO-001.remarks 档案 8 字段内）
#   2. adjust_production_plan 调整配产（C1 ACTIONS #2；配产取版语义已有
#      RULE-PETRO-022，消费面在指标域）
#   3. adjust_injection_volume 配注上调（C1 ACTIONS #3；注水录入行为未建——
#      RULE-PETRO-028 narrative 如实注记）
# 素材边界（沿 bohai 底稿）：行为证据全部注源 R5。COMMAND 侧 = §2 采集链路+台账
#   录入；QUERY 侧 = §3 指标口径库的查询出口承载（M7 严格一对一，依赖边单向 M7→M2）。
# =====================================================================
model_type: BEHAVIOR
version: "1.0.0"
domain: petro
behaviors:
  # [R5·§2.1 手工录入环节 + A.2 班次报表] 班次手抄汇总（A/B/C）是脏数据主要来源
  - id: BH-PETRO-RecordDailyOutput
    name: 录入日产计量
    ownerEntity: AGG-PETRO-002
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - 井在册且状态非「待弃置」（R5·§4 规则 9 状态机；停产/检修井可否录入待 Owner 确认）
    postconditions:
      - field: dailyProduction.oilOutput
        setValue: newOilOutput
      - field: dailyProduction.reportShift
        setValue: shift
    appliedRules:
      - RULE-PETRO-005
    requiredPermissions:
      - PERM-PETRO-RecordDailyOutput
  # [R5·A.6 化验台账 + §4 规则 3 折算密度域]
  - id: BH-PETRO-RecordFluidTest
    name: 录入流体化验结果
    ownerEntity: AGG-PETRO-006
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - 取样日期在册（频次不齐不强校验——R5·A.6 高产周报/低产半月报，插补规则待 Owner）
    postconditions:
      - field: fluidTest.waterCutLab
        setValue: newWaterCutLab
      - field: fluidTest.density
        setValue: newDensity
    appliedRules:
      - RULE-PETRO-001
    requiredPermissions:
      - PERM-PETRO-RecordFluidTest
  # [R5·A.4 batch_id 补录标记（样本 20260911-T3，T-3 案例）+ §4 规则 9 状态迁移]
  - id: BH-PETRO-RecordOverhaul
    name: 补录井检修台账
    ownerEntity: AGG-PETRO-004
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - 批次号带补录标记（R5·A.4 样本 20260911-T3；补录窗口阈值待 Owner 确认）
    postconditions:
      - field: wellOverhaul.overhaulStart
        setValue: newOverhaulStart
      - field: wellOverhaul.overhaulEnd
        setValue: newOverhaulEnd
      - field: wellOverhaul.batchId
        setValue: newBatchId
    appliedRules:
      - RULE-PETRO-007
    requiredPermissions:
      - PERM-PETRO-RecordOverhaul
  # [R5·§2.1「ETL 入数据仓库（15 分钟级闭环调度）」+ §4 质量闭环流程「规则命中→问题单生成」]
  - id: BH-PETRO-RunDailyQualityCheck
    name: 执行日产质检
    ownerEntity: AGG-PETRO-002
    behaviorType: COMMAND
    triggerType: SYSTEM
    preconditions:
      - 当日批次数据就位（R5·§2.1 15 分钟级闭环调度）
    postconditions:
      - field: qualityCheck.result
        setValue: checkReport
    appliedRules:
      - RULE-PETRO-002
      - RULE-PETRO-003
      - RULE-PETRO-004
      - RULE-PETRO-008
    requiredPermissions: []
  # [R5·§3 指标抽查面 + §5 Join 白名单 oil ⋈ well ✓] QR-PETRO-001 的查询行为（M7 一对一）
  - id: BH-PETRO-QueryWellDailyOutput
    name: 查询单井日产量
    ownerEntity: AGG-PETRO-001
    behaviorType: QUERY
    triggerType: USER_ACTION
    preconditions: []
    postconditions: []
    # 提取件二落地后装配接线（2026-09-21，PROP-023）：日产突变告警与班次键完整性属日产量口径面，
    # 出厂集同源断言（core 文本命中 ⊆ 卡片装配闭包）实弹照出——新规则须接线进装配面，非fixture误报
    appliedRules:
      - RULE-PETRO-027
      - RULE-PETRO-030
    requiredPermissions:
      - PERM-PETRO-QueryWellDailyOutput
  # [R5·§3 指标 1 产量完成率 + 指标 2 有效产量（两支口径）] 本票影响分析变更的消费枢纽
  - id: BH-PETRO-QueryBlockMonthlyCompletion
    name: 查询区块月度产量完成率
    ownerEntity: AGG-PETRO-002
    behaviorType: QUERY
    triggerType: USER_ACTION
    preconditions:
      - 统计月已封账（R5·§3 指标 1 粒度=月/区块；封账规则待 Owner 确认）
    postconditions: []
    appliedRules:
      - RULE-PETRO-009
      - RULE-PETRO-019
    requiredPermissions:
      - PERM-PETRO-QueryBlockMonthlyCompletion
  # [R5·§3 指标 5 综合含水率] 化验/计量打架注记经 RULE-PETRO-002 容差承载
  - id: BH-PETRO-QueryBlockWaterCut
    name: 查询区块综合含水率
    ownerEntity: AGG-PETRO-002
    behaviorType: QUERY
    triggerType: USER_ACTION
    preconditions: []
    postconditions: []
    appliedRules:
      - RULE-PETRO-010
    requiredPermissions:
      - PERM-PETRO-QueryBlockWaterCut
  # [R5·§3 指标 11 商品量] 与井口口径天然不等（A.8/事故 7）注记随查询出口描述承载
  - id: BH-PETRO-QueryMonthlySettlement
    name: 查询区块月度商品量结算
    ownerEntity: AGG-PETRO-008
    behaviorType: QUERY
    triggerType: USER_ACTION
    preconditions: []
    postconditions: []
    appliedRules: []
    requiredPermissions:
      - PERM-PETRO-QueryMonthlySettlement
