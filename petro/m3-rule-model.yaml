      - BH-PETRO-RecordOverhaul
  # [D1 存量面] 吨方混写存量误录行批扫检出（Owner 2026-09-21，PROP-BOHAI-006 采纳=判据两级+处置A）
  - id: RULE-PETRO-020
    name: 吨方混写存量行检出
    ruleType: VALIDATION
    description: "D1 存量面（R5·A.2「oil_output DECIMAL(10,2) 吨（个别行误录为方）」；增量防呆=RULE-PETRO-001）。判据两级（Owner 2026-09-21，PROP-BOHAI-006）：确诊=油>液（物理不可能，硬证据）；疑似=按区块密度基准（渤南 0.86/渤中 0.89/渤西 0.91，R5·§2.2）折算后仍越出合理吨值域（软证据，须人复核）。处置=A 出清单交业务修复（语义层不吞存量修复，step2 §二 D1 先例）——定期批扫出确诊/疑似两级清单，修复动作回业务系统，不在查询层做换算遮羞。"
    inputParams:
      - name: oilOutput
        type: Decimal
        sourceField: dailyProduction.oilOutput
        required: true
      - name: liquidOutput
        type: Decimal
        sourceField: dailyProduction.liquidOutput
        required: true
      - name: blockName
        type: String
        sourceField: well.blockName（区块密度基准索引）
        required: true
    outputType: Boolean
    expression: oilOutput <= liquidOutput   # 确诊级：违反=物理不可能（误录为方致油值虚放大约 13%）
    narrative: 疑似级（表达式外批扫）：oilOutput ÷ 区块密度基准（渤南 0.86/渤中 0.89/渤西 0.91）折算后越出合理吨值域者入疑似清单，须人复核；确诊/疑似两级清单定期批扫产出交业务系统修复（处置 A）
    reusedBy: []
  # [§3 指标 8] 措施有效率（Owner 素材 owner-materials-2026-09-21 §PROP-024，Owner 确认 2026-09-21——与 PROP-018 基线参数阈值整体生效）
  - id: RULE-PETRO-034
    name: 措施有效率
    ruleType: CALCULATION
    description: "R5·§3 指标 8（Owner=采油工艺所）。「有效」判据（Owner 素材 2026-09-21）：措施日后 30 日为见效观察期起点，见效期 90 日；判据=见效期内累增油 ≥80 t（相对 RULE-PETRO-018 基线）**或**有效期 ≥180 日（effectiveTo−effectiveFrom），满足其一即有效；两条判据字段齐备才可判，缺 effective_from/to 的行记「待判」不默认有效（D12 缺失行处置承接 PROP-BOHAI-017 清单制）。承载面：AGG-PETRO-005 措施台账。"
    inputParams:
      - name: incrementalOil90d
        type: Decimal
        sourceField: 见效期90日累增油（数据集级派生：相对 RULE-PETRO-018 基线，无承载字段）
        required: true
      - name: effectiveFrom
        type: Date
        sourceField: wellMeasures.effectiveFrom
        required: true
      - name: effectiveTo
        type: Date
        sourceField: wellMeasures.effectiveTo
        required: true
    outputType: Decimal
    # [口径登记·schema 1.3.0·裁决 e（Owner 2026-09-29）] R5·§3 指标 8 卡原文：☆（粒度/单位卡面未列——待素材，不发明）
    mark: ☆
    expression: 100 * count(有效措施) / count(判据齐备措施)   # 有效=(累增油90d≥80t) or (有效期≥180日)；判据缺field记「待判」不入分母
    narrative: 双判据任一满足即有效；「待判」行不进分母（与 PROP-017 缺失行不入分母口径一致）；阈值 80t/90日/180日与 PROP-018 基线参数（基期6个月/dₐ∈[0,0.05]）整体生效，单独调整须复核咬合
    reusedBy: []
  # [§3 指标 12] 机采系统能效（Owner 素材 owner-materials-2026-09-21 §PROP-025，Owner 确认 2026-09-21）
  - id: RULE-PETRO-035
    name: 机采系统能效
    ruleType: CALCULATION
    description: "R5·§3 指标 12。三级公式（Owner 素材 2026-09-21）：系统级 η_sys=Σ各井有效功率/Σ各井输入功率×100%；单元级 η_unit=P_eff/P_in×100%（P_eff=Δp×Q，kW；P_in=实测输入电功率）；设备级 η_dev=设备输出/输入功率×100%（电机/皮带/泵分段连乘校核）。单位随裁：load=kN、current=A（用于设备级功率核算，不直接进 η_unit 分子）。优良/合格档名待 Owner 定档值（档值=规则参数不进本体）。"
    inputParams:
      - name: effectivePower
        type: Decimal
        sourceField: 有效功率 P_eff=Δp×Q（数据集级派生，kW）
        required: true
      - name: inputPower
        type: Decimal
        sourceField: 输入电功率（数据集级派生，kW；current×电压采集面）
        required: true
    outputType: Decimal
    # [口径登记·schema 1.3.0·裁决 e（Owner 2026-09-29）] R5·§3 指标 12 卡原文：☆（粒度/单位卡面未列——待素材，不发明）
    mark: ☆
    expression: effectivePower / inputPower * 100   # 单元级 η_unit；系统级=聚合口径同构加权；设备级分段连乘校核
    narrative: 三级同构「有效功率/输入功率×100%」；load（kN）/current（A）单位已声明（m1 注记）；优良/合格档值属规则参数待 Owner
    reusedBy: []
