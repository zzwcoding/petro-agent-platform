  # [R-20] 检修补录批次号格式
  - id: RULE-PETRO-033
    name: 检修补录批次号格式校验
    ruleType: VALIDATION
    description: "提取件二 R-20（Owner 素材 2026-09-21）。well_overhaul 批次号形如 YYYYMMDD-T<n>（n=整数，为追认天数；20260911-T3=T-3 已有案例）；格式不符进问题单，不阻断入库。"
