[tool.importlinter]
root_package = "appv2"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "V2 层间单向向下（appv2.api 为最上层）"
type = "forbidden"
source_modules = ["appv2.runtime", "appv2.tools", "appv2.knowledge", "appv2.query", "appv2.retrieval", "appv2.infra"]
forbidden_modules = ["appv2.api"]

[[tool.importlinter.contracts]]
name = "V2 runtime 只经 tools 接触世界"
type = "forbidden"
source_modules = ["appv2.runtime"]
forbidden_modules = ["appv2.knowledge", "appv2.query", "appv2.retrieval"]
allow_indirect_imports = true  # modules.md 边界规则语义＝直接引用才违规（tools 包装引擎即设计路径——V2-06 起 runtime 真消费 tools，传递链不算触界）

[[tool.importlinter.contracts]]
name = "V2 tools/runtime 不互咬（单向向下防环）"
type = "forbidden"
source_modules = ["appv2.tools"]
forbidden_modules = ["appv2.runtime"]

[[tool.importlinter.contracts]]
name = "V2 引擎互禁（query→knowledge 为登记例外，走公开接口）"
type = "forbidden"
source_modules = ["appv2.knowledge", "appv2.retrieval"]
forbidden_modules = ["appv2.query"]

[[tool.importlinter.contracts]]
name = "V2 引擎互禁（knowledge→retrieval 禁引）"
type = "forbidden"
source_modules = ["appv2.knowledge"]
forbidden_modules = ["appv2.retrieval"]

[[tool.importlinter.contracts]]
name = "V2 引擎互禁（retrieval→knowledge 禁引）"
type = "forbidden"
source_modules = ["appv2.retrieval"]
forbidden_modules = ["appv2.knowledge"]

[[tool.importlinter.contracts]]
name = "V2 不咬 V1（双向禁引之 V2 侧）"
type = "forbidden"
source_modules = ["appv2"]
forbidden_modules = ["app"]

[[tool.importlinter.contracts]]
name = "ADR-0002 红线①langgraph 只许在 appv2.runtime"
type = "forbidden"
source_modules = ["appv2.api", "appv2.tools", "appv2.knowledge", "appv2.query", "appv2.retrieval", "appv2.infra"]
forbidden_modules = ["langgraph", "langchain", "langchain_core", "langchain_community"]
allow_indirect_imports = true  # modules.md api 卡语义＝api 只许消费 runtime 公开接口，而 runtime 内部承载 langgraph（ADR-0002）——api→runtime→langgraph 传递链是设计路径非触界（P-008·V2-07 起 api 真消费 runtime；R6 同款判例：直接引用才违规，红线咬合面＝本模块不得直接 import 框架）

[[tool.importlinter.contracts]]
name = "V2 B6：litellm 唯一接触点=appv2.infra.llm_client"
type = "forbidden"
source_modules = ["appv2"]
forbidden_modules = ["litellm"]
ignore_imports = [
    "appv2.infra.llm_client -> litellm",
]

# ===== ADR-0007 落位批：runtimev2 内部边界（specs/modules.md 边界规则 R1–R6）=====

[[tool.importlinter.contracts]]
name = "R1 runtimev2 七个业务相位互不 import（顺序由编排层定；ADR-0007）"
type = "forbidden"
source_modules = ["appv2.runtimev2.understanding", "appv2.runtimev2.clarification", "appv2.runtimev2.tool_matching", "appv2.runtimev2.preconditions", "appv2.runtimev2.execution", "appv2.runtimev2.answering", "appv2.runtimev2.verification"]
forbidden_modules = ["appv2.runtimev2.clarification", "appv2.runtimev2.tool_matching", "appv2.runtimev2.preconditions", "appv2.runtimev2.execution", "appv2.runtimev2.answering", "appv2.runtimev2.verification", "appv2.runtimev2.understanding"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "R2 runtimev2 业务相位只经公共层包根（禁深层子模块）"
type = "forbidden"
source_modules = ["appv2.runtimev2.understanding", "appv2.runtimev2.clarification", "appv2.runtimev2.tool_matching", "appv2.runtimev2.preconditions", "appv2.runtimev2.execution", "appv2.runtimev2.answering", "appv2.runtimev2.verification"]
forbidden_modules = ["appv2.runtimev2.state.*", "appv2.runtimev2.orchestration.*", "appv2.runtimev2.bookkeeping.*", "appv2.runtimev2.prompts.*", "appv2.runtimev2.parsing.*", "appv2.runtimev2.context.*", "appv2.runtimev2.transport.*", "appv2.runtimev2.persistence.*", "appv2.runtimev2.gateway_adapter.*"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "R3 runtimev2 parsing/prompts 只许依赖 state"
type = "forbidden"
source_modules = ["appv2.runtimev2.parsing", "appv2.runtimev2.prompts"]
forbidden_modules = ["appv2.runtimev2.understanding", "appv2.runtimev2.clarification", "appv2.runtimev2.tool_matching", "appv2.runtimev2.preconditions", "appv2.runtimev2.execution", "appv2.runtimev2.answering", "appv2.runtimev2.verification"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "R4 runtimev2 state 不 import 本包内任何其它块"
type = "forbidden"
source_modules = ["appv2.runtimev2.state"]
forbidden_modules = ["appv2.runtimev2.understanding", "appv2.runtimev2.clarification", "appv2.runtimev2.tool_matching", "appv2.runtimev2.preconditions", "appv2.runtimev2.execution", "appv2.runtimev2.answering", "appv2.runtimev2.verification"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "R5 runtimev2 不引用旧 runtime/（旧码只作备份）"
type = "forbidden"
source_modules = ["appv2.runtimev2"]
forbidden_modules = ["appv2.runtime"]

[[tool.importlinter.contracts]]
name = "R5b ADR-0002 红线① 扩展：框架只许在 runtimev2.orchestration（其余 16 块禁引）"
type = "forbidden"
source_modules = ["appv2.runtimev2.understanding", "appv2.runtimev2.clarification", "appv2.runtimev2.tool_matching", "appv2.runtimev2.preconditions", "appv2.runtimev2.execution", "appv2.runtimev2.answering", "appv2.runtimev2.verification", "appv2.runtimev2.state", "appv2.runtimev2.bookkeeping", "appv2.runtimev2.prompts", "appv2.runtimev2.parsing", "appv2.runtimev2.context", "appv2.runtimev2.transport", "appv2.runtimev2.persistence", "appv2.runtimev2.gateway_adapter", "appv2.runtimev2.gate"]
forbidden_modules = ["langgraph", "langchain", "langchain_core", "langchain_community"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "R6 runtimev2 各块只经 tools 接触引擎（禁直引 knowledge/query/retrieval；ADR-0007）"
type = "forbidden"
source_modules = ["appv2.runtimev2.understanding", "appv2.runtimev2.clarification", "appv2.runtimev2.tool_matching", "appv2.runtimev2.preconditions", "appv2.runtimev2.execution", "appv2.runtimev2.answering", "appv2.runtimev2.verification", "appv2.runtimev2.state", "appv2.runtimev2.orchestration", "appv2.runtimev2.bookkeeping", "appv2.runtimev2.prompts", "appv2.runtimev2.parsing", "appv2.runtimev2.context", "appv2.runtimev2.transport", "appv2.runtimev2.persistence", "appv2.runtimev2.gateway_adapter", "appv2.runtimev2.gate"]
forbidden_modules = ["appv2.knowledge", "appv2.query", "appv2.retrieval"]

[[tool.importlinter.contracts]]
name = "R7 runtimev2 各块只经 gateway_adapter 调模型（禁直引 appv2.infra.llm_client；B6 的 runtimev2 面）"
type = "forbidden"
source_modules = ["appv2.runtimev2.understanding", "appv2.runtimev2.clarification", "appv2.runtimev2.tool_matching", "appv2.runtimev2.preconditions", "appv2.runtimev2.execution", "appv2.runtimev2.answering", "appv2.runtimev2.verification", "appv2.runtimev2.state", "appv2.runtimev2.orchestration", "appv2.runtimev2.bookkeeping", "appv2.runtimev2.prompts", "appv2.runtimev2.parsing", "appv2.runtimev2.context", "appv2.runtimev2.transport", "appv2.runtimev2.persistence", "appv2.runtimev2.gate"]
forbidden_modules = ["appv2.infra.llm_client"]

[[tool.importlinter.contracts]]
name = "R8 runtimev2 零 LLM 面：preconditions/verification 不得引 gateway_adapter（铁律不调模型）"
type = "forbidden"
source_modules = ["appv2.runtimev2.preconditions", "appv2.runtimev2.verification"]
forbidden_modules = ["appv2.runtimev2.gateway_adapter"]
